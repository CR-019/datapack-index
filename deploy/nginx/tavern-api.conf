# 酒馆看板后端 · Nginx 反代片段
#
# 适用：宝塔面板 / 常规 Nginx（与镜像站同机）。整段贴进站点配置的 server 块内，
# 或按下面的独立子域方式单独建一个 conf。
#
# 为什么用**独立子域**而不是路径前缀：
#   作者中心与写接口必须**同源**（会话 cookie 才不会跨站），
#   而且这个域名不该被搜索引擎收录。独立子域最好管。
#
# 前端页面在 api.vanillalibrary.mcfpp.top/author（见设计文档 §7.4 ②）。

server {
    listen 443 ssl http2;
    server_name api.vanillalibrary.mcfpp.top;

    # 证书按宝塔生成的位置填
    ssl_certificate     /www/server/panel/vhost/cert/api.vanillalibrary.mcfpp.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.vanillalibrary.mcfpp.top/privkey.pem;

    # 作者中心与接口都不该被收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ⚠️ 必须 > 投稿 zip 上限（20MB），否则上传会在到达 Node 之前被 Nginx 用 413 挡掉，
    #    作者看到的是一句没有上下文的 413，排查起来很费时间。
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9878;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 服务端只有在 TAVERN_TRUST_PROXY=1 时才采信这些头；
        # 采信后限流键才是"真正的客户端 IP + pin"
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 投稿解包 + 校验可能要几秒，给足时间
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 会话 cookie 由后端下发（HttpOnly/Secure），反代不要动它
        proxy_pass_request_headers on;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name api.vanillalibrary.mcfpp.top;
    return 301 https://$host$request_uri;
}
