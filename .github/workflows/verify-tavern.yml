name: Verify tavern board

# 酒馆看板后端是**零运行时依赖**的（Node 内置 node:sqlite / node:zlib），
# 所以这个工作流不需要 pnpm install —— 装依赖那一步本身就是风险面，能免则免。

on:
  pull_request:
    paths:
      - "tavern-server/**"
      - ".vitepress/vue/tavern/**"
      - "tavern/**"
      - "public/tavern-snapshot.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-tavern.yml"
  push:
    branches:
      - master
      - "feat/**"
    paths:
      - "tavern-server/**"
      - ".vitepress/vue/tavern/**"
      - "tavern/**"
      - "public/tavern-snapshot.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-tavern.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run tests
        working-directory: tavern-server
        run: npm test

      # E2E 走查（专题）：每条用例一个独立夹具库 + 独立服务进程，全程真实 HTTP。
      # 这里只跑后端部分 —— 浏览器用例要站点构建产物，放下面那个 job。
      - name: End-to-end walkthrough (backend cases)
        working-directory: tavern-server
        run: npm run e2e

      - name: Scan for committed secrets
        working-directory: tavern-server
        run: npm run check:secrets

      # 这条是快照约定的保险丝：种子数据是可复现的（固定时间戳），
      # 因此仓库里的快照必须能被当前代码 + 仓库数据重新生成出来。
      # 任何人改了读模型或种子却忘记更新快照，CI 会立刻打红。
      - name: Rebuild seed and verify the committed snapshot is in sync
        working-directory: tavern-server
        run: |
          npm run seed
          npm run snapshot:check

  # 为什么需要这个 job：本工作流上面那个跑的是后端，**不碰 Vue 组件**；
  # 而 deploy.yml 只在 master push 时构建站点。也就是说，一个写坏的
  # StageStrip.vue 可以顺利通过所有 PR 门禁，直到合并后部署时才炸。
  # 酒馆前端有自己的 Vue 组件与 CSS，必须真的构建一遍。
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.13.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress
        run: pnpm exec vitepress build
        env:
          VITEPRESS_BASE: /datapack-index/
          NODE_OPTIONS: --max-old-space-size=3584

      # 离线兜底文件必须真的进了构建产物——前端连不上后端时全靠它，
      # 而"文件在 public/ 里"和"它被发布出去了"是两件事。
      - name: The offline snapshot must reach the built site
        run: test -s .vitepress/dist/tavern-snapshot.json

      # 有了构建产物，就能跑**带浏览器**的那几条 E2E（工作台交互、页面层泄露检查）。
      # runner 自带 Chrome，所以不需要额外装东西。
      - name: End-to-end walkthrough (with browser)
        working-directory: tavern-server
        run: npm run e2e -- --browser
