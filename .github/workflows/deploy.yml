name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.13.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore image optimizer cache
        uses: actions/cache@v4
        with:
          path: .cache/image-optimizer/v1
          key: image-optimizer-v1-${{ hashFiles('**/*.[pP][nN][gG]', '**/*.[jJ][pP][gG]', '**/*.[jJ][pP][eE][gG]', '**/*.[sS][vV][gG]', '!node_modules/**', '!.cache/**', '!.vitepress/dist/**') }}
          restore-keys: |
            image-optimizer-v1-

      - name: Restore syntax highlighting cache
        uses: actions/cache@v4
        with:
          path: .cache/shiki/v1
          key: shiki-v1-${{ hashFiles('**/*.md', '.vitepress/config.mts', '.vitepress/highlights/**', '.vitepress/markdown/shiki-cache.mjs', 'package.json', 'pnpm-lock.yaml', '!node_modules/**', '!.cache/**', '!.vitepress/dist/**') }}
          restore-keys: |
            shiki-v1-

      - name: Build site
        run: pnpm run docs:build
        env:
          VITEPRESS_BASE: /datapack-index/
          NODE_OPTIONS: --max-old-space-size=3584

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - name: Upload shared deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: .vitepress/dist
          include-hidden-files: true

  deploy_github:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_sftp:
    name: SFTP Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download shared artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: .vitepress/dist

      - name: Upload mirror
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: .vitepress/dist/
          target: /www/wwwroot/vanillalibrary.mcfpp.top/datapack-index/
          overwrite: true
          strip_components: 2

      - name: Copy index
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: .vitepress/dist/index.html
          target: /www/wwwroot/vanillalibrary.mcfpp.top
          overwrite: true
          strip_components: 2

  deploy_mcfpp:
    name: MCFPP Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download shared artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: .vitepress/dist

  deploy_repeater:
    name: Redstone Repeater Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download shared artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: .vitepress/dist

      - name: Compress artifact
        working-directory: .vitepress/dist
        run: zip -r ../../artifact.zip .

      - name: Deploy to server
        uses: redstone-ore/actions-docs-deploy@v1.0.3
        with:
          file: artifact.zip
          resource_id: ${{ secrets.RESOURCE_ID }}
          bearer_token: ${{ secrets.BEARER_TOKEN }}
          poll_timeout: "6000"
